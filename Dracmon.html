async function down(){
 $('pe').classList.add('gone');burst(...POS.p,'rock',30,3);beep(120,.4,'sawtooth');await say(`${nm(P())} fainted!`);
 if(!G.team.some(c=>c.hp>0)){G.team.forEach(c=>c.hp=mx(c));return field('All your shadows have fallen. The Gate throws you out, but your shadows return to you.')}
 teamMenu('force');
}
function swap(i){[G.team[0],G.team[i]]=[G.team[i],G.team[0]];P().st={a:0,d:0}}
function teamMenu(ctx){
 $('log').textContent=ctx=='field'?'Team: tap to lead.':'Switch to who?';
 const it=G.team.map((c,i)=>[`${S[c.si].e} ${S[c.si].n} L${c.l} ${c.hp}/${mx(c)}${c.sx?' '+c.sx:''}`,async()=>{
  if(i===0)return ctx=='field'?field():battleMenu();
  swap(i);if(ctx=='field')return field();render(1);enter('pe');await say(`Go, ${S[P().si].n}!`);
  ctx=='force'?battleMenu():enemyAct()},c.hp<=0||(i===0&&ctx=='force')]);
 if(ctx!='force')it.push(['Back',()=>ctx=='field'?field():battleMenu()]);
 if(ctx=='field'&&G.box.length)it.push([`Box (${G.box.length})`,boxMenu]);
 menu(it);
}
function boxMenu(){
 $('log').textContent='Box: tap to swap with your lead.';
 menu([...G.box.slice(0,6).map((c,i)=>[`${S[c.si].e} ${S[c.si].n} L${c.l}`,()=>{const l=G.team[0];G.team[0]=c;G.box[i]=l;field()}]),['Back',()=>teamMenu('field')]]);
}
const itl=k=>`${IT[k][0]} x${G.bag[k]||0}`;
function bagField(){
 $('log').textContent='Use which item?';
 menu([...['potion','super','revive','heal'].map(k=>[itl(k),()=>target(k),!G.bag[k]]),['Back',()=>field()]]);
}
function target(k){
 $('log').textContent='Use on who?';
 menu([...G.team.map(c=>[`${S[c.si].e} ${c.hp}/${mx(c)}`,()=>{
  G.bag[k]--;if(k=='heal')c.sx=null;else if(k=='revive')c.hp=Math.floor(mx(c)/2);else c.hp=Math.min(mx(c),c.hp+(k=='potion'?25:60));bagField()},
  k=='heal'?!c.sx:k=='revive'?c.hp>0:(c.hp<=0||c.hp>=mx(c))]),['Back',bagField]]);
}
function bagBattle(){
 $('log').textContent='Use which item?';const p=P();
 const heal=k=>async()=>{G.bag[k]--;p.hp=Math.min(mx(p),p.hp+(k=='potion'?25:60));render(1);await say(`${S[p.si].n} recovered health.`);enemyAct()};
 const bd=mode!='wild'||G.bag.ball+G.bag.great<0;
 menu([['potion','super'].map(k=>[itl(k),heal(k),!G.bag[k]||p.hp>=mx(p)]),[].map(k=>[itl(k),()=>ball(k),!G.bag[k]||mode!='wild']),['heal'].map(k=>[itl(k),async()=>{G.bag[k]--;p.sx=null;render(1);await say(`${S[p.si].n} was cured.`);enemyAct()},!G.bag[k]||!p.sx])].flat().concat([['Back',battleMenu]]));
}
async function ball(k){
 G.bag[k]--;const ch=(1-.66*E.hp/mx(E))*.5*(k=='great'?1.8:1)*(E.si==12||E.si==13?.5:1)+(E.sx?.15:0);
 const ok=Math.random()<ch;say('You threw a catch ball...',100);await fxBall(ok);if(ok){E.sx=null;E.st={a:0,d:0};(G.team.length<6?G.team:G.box).push(E);mark(E.si,'caught');
  await say(`Caught ${S[E.si].n}! ${G.team.includes(E)?'It joined your team.':'It was sent to the box.'}`,1200);G.gold+=5;field()}
 else{await say(`${S[E.si].n} broke free!`);enemyAct()}
}
async function run(){if(Math.random()<.65){await say('You got away safely.');field()}else{await say("Couldn't escape!");enemyAct()}}
function shop(){
 const g=G.gear,cw=150*(g.w+1),ca=150*(g.a+1);
 $('log').textContent=`[Hunters Association] Gold ${G.gold}\nWeapon +${g.w}: +${g.w*2} attack and +${g.w*4}% for your shadows\nArmor +${g.a}: +${g.a*4} health and +${g.a*4}% for your shadows`;
 menu([[`Upgrade Weapon ${cw}g`,()=>{G.gold-=cw;g.w++;render();shop()},G.gold<cw],[`Upgrade Armor ${ca}g`,()=>{G.gold-=ca;g.a++;render();shop()},G.gold<ca],[`Sell Stones (${(G.stones||[]).length})`,stonesMenu],['Back',()=>field()]]);
}
start();
</script></body></html>
